name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Lint & Build (Nuxt 4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nuxt-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/nuxt-web/package.json

      - name: Install dependencies
        run: npm install

      - name: Type Check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Generate Static Site
        run: npm run generate

      - name: Install Chromium (a11y)
        run: sudo apt-get update && sudo apt-get install -y chromium

      - name: Accessibility Audit (axe-core)
        run: npm run test:a11y
