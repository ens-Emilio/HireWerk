# F10 — HireWerk API Worker (Cloudflare Workers + D1)
# Deploy: bunx wrangler deploy   (na pasta worker/)
# D1: bunx wrangler d1 create hirewerk-db && bunx wrangler d1 migrations apply hirewerk-db
name = "hirewerk-api"
main = "index.ts"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_id = "7b5312bf-bc36-42b2-b915-744057ac8b04"
migrations_dir = "migrations"

[vars]
# nada sensível em vars — o design E2E não exige segredos no servidor
